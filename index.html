<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Wedding Quotations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
<style>
:root{
  --ground:#F1F3F1; --sunk:#E7EAE7; --surface:#FFFFFF; --surface2:#F7F9F7; --surface3:#EEF1EF;
  --ink:#14181A; --ink2:#3A4144; --muted:#697174; --faint:#9AA1A2;
  --line:#DEE3E0; --line2:#C7CECB;
  --accent:#1C5C79; --accent2:#2A7FA3; --accentSoft:#E2EDF2; --accentLine:#BAD5E0;
  --ok:#3B7550; --okSoft:#E4EFE7;
  --warn:#9C5C0C; --warnSoft:#F7EBDA;
  --miss:#7C8385; --missSoft:#ECEEED;
  --calc:#5C4A8A; --calcSoft:#EBE7F4;
  --star:#A97A12; --starSoft:#F6EEDA;
  --rej:#9E3229; --rejSoft:#F6E7E5;
  --maybe:#5C4A8A; --maybeSoft:#EBE7F4;
  --shadow:0 1px 1px rgba(20,24,26,.04), 0 12px 26px -20px rgba(20,24,26,.35);
  --sans:"Archivo",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Fraunces",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1214; --sunk:#0A0C0D; --surface:#171B1D; --surface2:#1D2224; --surface3:#232829;
    --ink:#ECEFEE; --ink2:#C6CCCB; --muted:#949B9B; --faint:#6E7576;
    --line:#2A3032; --line2:#3A4144;
    --accent:#6FB6D4; --accent2:#8CC8E1; --accentSoft:#132A34; --accentLine:#23485A;
    --ok:#74B58C; --okSoft:#142218;
    --warn:#D9A05A; --warnSoft:#2A2015;
    --miss:#8E9596; --missSoft:#222627;
    --calc:#A996D8; --calcSoft:#1E1A2B;
    --star:#D4AA4E; --starSoft:#282013;
    --rej:#DE8A80; --rejSoft:#2B1917;
    --maybe:#A996D8; --maybeSoft:#1E1A2B;
    --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 26px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1214; --sunk:#0A0C0D; --surface:#171B1D; --surface2:#1D2224; --surface3:#232829;
  --ink:#ECEFEE; --ink2:#C6CCCB; --muted:#949B9B; --faint:#6E7576;
  --line:#2A3032; --line2:#3A4144;
  --accent:#6FB6D4; --accent2:#8CC8E1; --accentSoft:#132A34; --accentLine:#23485A;
  --ok:#74B58C; --okSoft:#142218;
  --warn:#D9A05A; --warnSoft:#2A2015;
  --miss:#8E9596; --missSoft:#222627;
  --calc:#A996D8; --calcSoft:#1E1A2B;
  --star:#D4AA4E; --starSoft:#282013;
  --rej:#DE8A80; --rejSoft:#2B1917;
  --maybe:#A996D8; --maybeSoft:#1E1A2B;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 26px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2;text-wrap:balance}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit;font-family:var(--sans)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:1460px;margin:0 auto;padding:0 22px}
@media(max-width:640px){.wrap{padding:0 14px}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.small{font-size:12.5px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:flex-end;gap:18px;padding:14px 0 10px;flex-wrap:wrap}
.brand{margin-right:auto;display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.015em}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.tools{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accentSoft);border-color:var(--accentLine);color:var(--accent);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap;transition:.15s}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground);font-weight:600}

main{padding:26px 0 100px}
.panel{display:none}
.panel.active{display:block}
.sechead{margin-bottom:18px;max-width:78ch}
.sechead h2{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em}
.sechead p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;margin-bottom:16px;padding:9px 13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}

/* status chips */
.chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.07em;padding:2px 6px;border-radius:4px;white-space:nowrap;text-transform:uppercase}
.c-q{background:var(--okSoft);color:var(--ok)}
.c-c{background:var(--calcSoft);color:var(--calc)}
.c-m{background:var(--missSoft);color:var(--miss)}
.c-u{background:var(--warnSoft);color:var(--warn)}
.val.s-m{color:var(--miss);font-style:italic}
.val.s-u{color:var(--warn)}
.src{display:none;margin-top:6px;padding:7px 10px;border-left:2px solid var(--accentLine);background:var(--surface3);border-radius:0 6px 6px 0;font-size:11.5px;color:var(--muted);white-space:pre-wrap;line-height:1.45}
.src::before{content:"from the quotation \201C";}
.src::after{content:"\201D";}
body.showsrc .src,.src.open{display:block}
.srcbtn{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:10px;font-family:var(--mono);padding:0 2px;margin-left:3px;line-height:1}
.srcbtn:hover{color:var(--accent)}

/* dashboard */
.dashgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:18px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;padding:0;overflow:hidden;box-shadow:var(--shadow)}
.pcard.st-short{border-color:var(--star);box-shadow:0 0 0 1px var(--star),var(--shadow)}
.pcard.st-rejected{opacity:.62}
.pcard .rebate{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 16px;background:var(--surface3);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.pcard .body{padding:16px;display:flex;flex-direction:column;gap:13px;flex:1}
.pcard h3{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.015em}
.refline{font-size:12.5px;color:var(--muted);margin-top:3px}
.refline b{color:var(--ink2);font-weight:600}
.headrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.priceblk{text-align:right;flex:none}
.priceblk .p{font-family:var(--mono);font-size:21px;font-weight:500;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.priceblk .ps{font-size:10.5px;color:var(--muted);margin-top:1px}
.iglink{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px;transition:.15s}
.iglink:hover{color:var(--accent);border-color:var(--accentLine);background:var(--accentSoft)}
.tiersel{display:inline-flex;background:var(--sunk);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.tiersel button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:11.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tiersel button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.speclist{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
.speclist dt{color:var(--muted)}
.speclist dd{margin:0;font-family:var(--mono);font-size:12px}
.taglist{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--ink2);line-height:1.5}
.tag.pos{background:var(--okSoft);color:var(--ok)}
.tag.neg{background:var(--missSoft);color:var(--miss)}
.tag.warn{background:var(--warnSoft);color:var(--warn)}
.cardfoot{margin-top:auto;padding:11px 16px;border-top:1px solid var(--line);background:var(--surface2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sbtn{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:3px 9px;font-size:11.5px;cursor:pointer;transition:.15s}
.sbtn:hover{border-color:var(--accent)}
.sbtn.on-shortlisted{background:var(--starSoft);border-color:var(--star);color:var(--star);font-weight:600}
.sbtn.on-maybe{background:var(--maybeSoft);border-color:var(--maybe);color:var(--maybe);font-weight:600}
.sbtn.on-rejected{background:var(--rejSoft);border-color:var(--rej);color:var(--rej);font-weight:600}
.stars{display:inline-flex;gap:0;margin-left:auto}
.stars button{border:0;background:transparent;cursor:pointer;font-size:15px;line-height:1;color:var(--line2);padding:0 1px}
.stars button.lit{color:var(--star)}
.stars button:hover{color:var(--star)}

/* tables */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:76vh;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;z-index:3;background:var(--surface2);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
tr.grouprow td{background:var(--sunk);color:var(--ink2);font-family:var(--mono);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:7px 14px}
tr.grouprow:hover td{background:var(--sunk)}
th.rowlab,td.rowlab{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line2);font-weight:600;font-size:12.5px;min-width:186px;max-width:210px}
tbody tr:hover td.rowlab{background:var(--surface2)}
thead th.rowlab{z-index:4;background:var(--surface2)}
tr.grouprow td.rowlab{background:var(--sunk);border-right-color:var(--line2)}
td.cell{min-width:215px;max-width:330px}
.colhead .n{font-family:var(--serif);font-size:15px;color:var(--ink);text-transform:none;letter-spacing:-.01em;font-weight:600}
.colhead .r{font-family:var(--sans);font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:1px;font-weight:400}
.colhead .pr{font-family:var(--mono);font-size:12.5px;color:var(--ink2);margin-top:3px;letter-spacing:0}

/* selectors */
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pill{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.pill .sw{width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none}
.pill[aria-pressed="true"] .sw{background:var(--ground)}
input[type=search],input[type=text],select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;width:100%;font-family:var(--sans)}
textarea{resize:vertical;min-height:62px;line-height:1.5}
.searchbox{max-width:270px}

/* accordions */
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:13px;background:var(--surface);flex-wrap:wrap}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:hover{background:var(--surface2)}
details.acc>summary .nm{font-family:var(--serif);font-size:17px;font-weight:600}
details.acc>summary .caret{margin-left:auto;color:var(--faint);transition:transform .2s;font-size:11px;font-family:var(--mono)}
details.acc[open]>summary .caret{transform:rotate(90deg)}
details.acc[open]>summary{border-bottom:1px solid var(--line);background:var(--surface2)}
.accbody{padding:18px}
.dl-sec{margin-bottom:22px}
.dl-sec:last-child{margin-bottom:0}
.dl-sec h4{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--accentLine);font-weight:500}
.dl-list{display:grid;gap:10px}
.dl-item{display:grid;grid-template-columns:196px 1fr;gap:16px;font-size:13px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.dl-item:last-child{border-bottom:0;padding-bottom:0}
.dl-item .k{color:var(--muted);font-size:12.5px}
@media(max-width:640px){.dl-item{grid-template-columns:1fr;gap:2px}.dl-item .k{font-weight:600;color:var(--ink2)}}

/* notes */
.notesgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.savedot{font-family:var(--mono);font-size:10px;color:var(--ok);opacity:0;transition:opacity .35s}
.savedot.show{opacity:1}

/* questions */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:880px){.qgrid{grid-template-columns:1fr}}
ul.qlist{margin:0;padding:0;list-style:none;display:grid;gap:7px}
ul.qlist li{display:flex;gap:9px;font-size:13px;align-items:flex-start;padding:9px 11px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);line-height:1.45}
ul.qlist li input[type=checkbox]{margin:3px 0 0;flex:none;accent-color:var(--accent);width:15px;height:15px}
ul.qlist li.done .txt{text-decoration:line-through;color:var(--muted)}
ul.qlist.confirmed li{background:var(--okSoft);border-color:transparent}
ul.qlist.confirmed li .mk{color:var(--ok);font-family:var(--mono);flex:none}
.qwhy{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

/* pricing + best-for */
.metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.metric{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.metric .m-l{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;line-height:1.4}
.metric .m-v{font-family:var(--mono);font-size:17px;margin-top:4px;letter-spacing:-.02em;color:var(--ink)}
.metric .m-n{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.bestlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.best{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 11px 11px 0;padding:15px 17px}
.best .cat{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:5px}
.best h4{font-family:var(--serif);font-size:18px;font-weight:600}
.best .win{font-family:var(--mono);font-size:13px;color:var(--ink2);margin-top:3px}
.basis{font-size:12.5px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.5}
.banner{background:var(--warnSoft);border-left:3px solid var(--warn);border-radius:0 9px 9px 0;padding:11px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:16px;line-height:1.5}
.banner b{color:var(--warn)}
.note-b{background:var(--accentSoft);border-left:3px solid var(--accent);border-radius:0 9px 9px 0;padding:11px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:16px;line-height:1.5}
.mmrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.mmrow:last-of-type{border-bottom:0}
.mmrow label{display:flex;gap:10px;align-items:center;cursor:pointer;flex:1}
.mmrow input{accent-color:var(--accent);width:15px;height:15px;flex:none}
.mmtotal{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line2)}
.mmtotal .v{font-family:var(--mono);font-size:22px}
.eventgrid{display:grid;gap:14px}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px;background:var(--surface);border:1px dashed var(--line2);border-radius:12px}
.footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
.filebadge{font-family:var(--mono);font-size:10.5px;background:var(--sunk);border-radius:4px;padding:1.5px 6px;color:var(--muted);word-break:break-all}
.decrow{display:grid;grid-template-columns:1.4fr 1fr 1fr 2fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.decrow:last-child{border-bottom:0}
@media(max-width:760px){.decrow{grid-template-columns:1fr 1fr;gap:8px}}
@media(max-width:640px){
  .topbar{gap:10px}
  .brand h1{font-size:18px}
  .sechead h2{font-size:22px}
  .dashgrid{grid-template-columns:1fr}
  .headrow{flex-direction:column;gap:8px}
  .priceblk{text-align:left}
  td.cell{min-width:190px}
  th.rowlab,td.rowlab{min-width:132px;max-width:150px;font-size:11.5px;padding:9px 10px}
  th,td{padding:9px 11px;font-size:12.5px}
  .tablewrap{max-height:70vh}
  .metricgrid{grid-template-columns:1fr 1fr}
  .btn{padding:5px 9px;font-size:11.5px}
}
.authnote{display:flex;gap:14px;align-items:flex-start;padding:13px 15px;border-radius:11px;margin-bottom:18px;font-size:13px;line-height:1.5}
.authnote b{display:block;margin-bottom:3px}
.authnote code{font-family:var(--mono);font-size:11.5px;background:rgba(128,128,128,.16);padding:1px 5px;border-radius:4px}
.authnote button{margin-left:auto;flex:none}
.authnote.bad{background:var(--warnSoft);border-left:3px solid var(--warn);color:var(--ink2)}
.authnote.ok{background:var(--accentSoft);border-left:3px solid var(--accent);color:var(--ink2)}
.btn.sm{padding:4px 9px;font-size:11.5px}
/* sync + comments */
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;background:var(--surface)}
.syncpill .led{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.syncpill.on .led{background:var(--ok)}
.syncpill.off .led{background:var(--warn)}
.syncpill img{width:19px;height:19px;border-radius:50%;flex:none}
.who{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}
.thread{display:grid;gap:9px;margin-top:10px}
.cmt{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.cmt .av{width:28px;height:28px;border-radius:50%;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;overflow:hidden}
.cmt .av img{width:100%;height:100%;object-fit:cover}
.cmt .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.cmt .nm{font-weight:600;font-size:12.5px}
.cmt .tm{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.cmt .bd{font-size:13px;white-space:pre-wrap;line-height:1.5}
.cmt .del{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:11px;margin-left:auto}
.cmt .del:hover{color:var(--rej)}
.cmtbox{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.cmtbox textarea{min-height:40px}
.gate{padding:16px;background:var(--accentSoft);border:1px dashed var(--accentLine);border-radius:11px;font-size:13px;color:var(--ink2);text-align:center}
.ratings{font-size:12px;color:var(--muted);margin-top:4px}
.ratings b{color:var(--ink2)}

   HELPERS
   ============================================================ */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rup(n){ // Indian numbering, e.g. 340000 -> 3,40,000
  var s=String(Math.round(n)); var last3=s.slice(-3); var rest=s.slice(0,-3);
  if(rest) last3=","+last3;
  return "₹"+rest.replace(/\B(?=(\d{2})+(?!\d))/g,",")+last3;
}
function fld(a){ if(!a) return {v:"",s:"m",q:""}; return {v:a[0]||"",s:(a[1]||"q"),q:a[2]||""}; }
var CHIP={c:["c-c","calculated"],u:["c-u","verify"],m:["c-m","not mentioned"],q:null};
var srcSeq=0;
function renderField(a){
  var f=fld(a); var v=f.v, s=f.s;
  if(!v){ s="m"; v="Not mentioned"; }
  var out="";
  var c=CHIP[s];
  if(c) out+='<span class="chip '+c[0]+'">'+c[1]+'</span> ';
  out+='<span class="val s-'+s+'">'+esc(v)+'</span>';
  if(f.q){
    var id="src"+(++srcSeq);
    out+='<button class="srcbtn" data-src="'+id+'" title="Show the original wording from the PDF">[source]</button>';
    out+='<div class="src" id="'+id+'">'+esc(f.q)+'</div>';
  }
  return out;
}
function pkgOf(p){ return p.packages[Math.min(state.tier[p.id]||0, p.packages.length-1)]; }
function crewCount(pkg,type){
  var n=0;
  pkg.events.forEach(function(e){ if(e.addon) return; e.crew.forEach(function(c){ if(!type||c.t===type) n+=c.n; }); });
  return n;
}
function crewLine(e){
  return e.crew.map(function(c){ return c.n+" "+c.r.toLowerCase()+(c.n>1?"s":"")+(c.note?" ("+c.note+")":""); }).join(" · ");
}
function mmTotal(){
  var t=0; var mm=byId("mm"); if(!mm) return 0;
  mm.packages[0].events.forEach(function(e){
    (e.lines||[]).forEach(function(l){ if(state.mm[l.id]) t+=l.price; });
  });
  return t;
}
function byId(id){ for(var i=0;i<PHOTOGRAPHERS.length;i++) if(PHOTOGRAPHERS[i].id===id) return PHOTOGRAPHERS[i]; return null; }
function priceInfo(p){
  var pkg=pkgOf(p);
  if(p.alacarte){
    var t=mmTotal();
    return {base:t, tax:0, total:t, calc:true,
      label:t?rup(t):"—", sub:"calculated from your selection", taxNote:"no tax stated"};
  }
  var base=pkg.price||0;
  var tax=pkg.taxRate?Math.round(base*pkg.taxRate):0;
  return {base:base, tax:tax, total:base+tax, calc:!!tax,
    label:rup(base), sub:pkg.taxRate?("+ "+rup(tax)+" GST = "+rup(base+tax)):"no tax stated in the quote",
    taxNote:pkg.taxRate?"18% GST excluded":"no tax stated"};
}
function deliverableCount(pkg){
  var n=0; for(var k in pkg.spec){ if(!pkg.spec.hasOwnProperty(k)) continue;
    var f=fld(pkg.spec[k]); if(f.v && f.s!=="m") n++; }
  return n;
}
function visiblePhotographers(){
  return PHOTOGRAPHERS.filter(function(p){
    if(state.filter==="all") return true;
    if(state.filter==="notrejected") return state.status[p.id]!=="rejected";
    return state.status[p.id]===state.filter;
  });
}

function filterBar(){
  var opts=[["all","All six"],["shortlisted","★ Shortlisted"],["maybe","Maybe"],["rejected","Rejected"],["notrejected","Everything but rejected"]];
  return '<div class="selbar"><span class="eyebrow">Show</span>'+opts.map(function(o){
    return '<button class="pill" data-filter="'+o[0]+'" aria-pressed="'+(state.filter===o[0])+'">'+esc(o[1])+'</button>';
  }).join("")+'</div>';
}
function legendBar(){
  return '<div class="legend"><b style="color:var(--ink)">How to read every value:</b>'+
   '<span><b style="color:var(--ok)">no tag</b> = quoted straight from the PDF</span>'+
   '<span><span class="chip c-c">calculated</span> worked out here, not by the photographer</span>'+
   '<span><span class="chip c-u">verify</span> ambiguous or contradictory</span>'+
   '<span><span class="chip c-m">not mentioned</span> absent from the quotation</span></div>';
}
function statusButtons(p){
  var s=statusOf(p);
  return ["shortlisted","maybe","rejected"].map(function(k){
    var lbl=k==="shortlisted"?"★ Shortlist":(k==="maybe"?"Maybe":"Reject");
    return '<button class="sbtn '+(s===k?"on-"+k:"")+'" data-status="'+k+'" data-p="'+p.id+'">'+lbl+'</button>';
  }).join("");
}
function starRow(p){
  var r=state.rating[p.id]||0; var out='<span class="stars" title="Your own rating out of 5">';
  for(var i=1;i<=5;i++) out+='<button data-star="'+i+'" data-p="'+p.id+'" class="'+(i<=r?"lit":"")+'" aria-label="Rate '+i+' of 5">'+(i<=r?"★":"☆")+'</button>';
  return out+'</span>';
}
function ratingsLine(p){
  var all=allRatings(p.id);
  if(all.length<2) return "";
  var avg=all.reduce(function(a,x){return a+x.r;},0)/all.length;
  return '<div class="ratings">Everyone: <b>'+avg.toFixed(1)+'/5</b> — '+
    all.map(function(x){return esc(x.n)+" "+x.r;}).join(" · ")+'</div>';
}
function tierSwitch(p){
  if(p.packages.length<2) return "";
  return '<div class="tiersel">'+p.packages.map(function(pk,i){
    return '<button data-tier="'+i+'" data-p="'+p.id+'" aria-pressed="'+((state.tier[p.id]||0)===i)+'">'+esc(pk.label)+'</button>';
  }).join("")+'</div>';
}

/* ---------- DASHBOARD ---------- */
function viewDash(){
  var list=visiblePhotographers();
  var h='<div class="sechead"><h2>Six quotations, one screen</h2><p>Every figure below is lifted from the PDF or text file named on each card. Nothing here is inferred: where a quotation is silent, it says so. Shortlist, rate and take notes as you go. Sign in and everything you write is shared with everyone on the list, on every device.</p></div>';
  h+=legendBar()+filterBar();
  if(!list.length) return h+'<div class="empty">Nothing matches that filter.</div>';
  h+='<div class="dashgrid">';
  list.forEach(function(p){
    var pkg=pkgOf(p), pi=priceInfo(p), st=statusOf(p);
    h+='<article class="pcard '+(st?"st-"+st:"")+'">';
    h+='<div class="rebate"><span>'+esc(p.referral?"via "+p.referral:"")+'</span><span>'+esc(pkg.label)+'</span></div>';
    h+='<div class="body">';
    h+='<div class="headrow"><div><h3>'+esc(p.name)+'</h3><div class="refline">Referred by <b>'+esc(p.referral)+'</b>'+(p.contactName?' · '+esc(p.contactName):'')+'</div></div>';
    h+='<div class="priceblk">'+(pi.calc&&p.alacarte?'<span class="chip c-c">calculated</span><br>':'')+'<div class="p">'+esc(pi.label)+'</div><div class="ps">'+esc(pi.sub)+'</div></div></div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
    h+='<a class="iglink" href="https://www.instagram.com/'+esc(p.ig)+'" target="_blank" rel="noopener">◎ @'+esc(p.ig)+'</a>';
    h+=tierSwitch(p)+'</div>';
    h+='<p class="small muted" style="margin:0">'+esc(p.blurb)+'</p>';
    h+='<dl class="speclist">';
    h+='<dt>Events</dt><dd>'+pkg.events.filter(function(e){return !e.addon;}).length+' — '+esc(pkg.events.filter(function(e){return !e.addon;}).map(function(e){return e.name.replace(/ \(.*/,"");}).join(", "))+'</dd>';
    h+='<dt>Photo crew</dt><dd>'+crewCount(pkg,"p")+' slots across the events</dd>';
    h+='<dt>Video crew</dt><dd>'+crewCount(pkg,"v")+' slots across the events</dd>';
    var ep=fld(pkg.spec.editedPhotos);
    h+='<dt>Edited photos</dt><dd>'+(ep.v?esc(ep.v.length>46?ep.v.slice(0,46)+"…":ep.v):'<span class="s-m" style="font-style:italic">not stated</span>')+'</dd>';
    var hrs=fld(pkg.spec.hours);
    h+='<dt>Hours</dt><dd>'+(hrs.v?esc(hrs.v.length>46?hrs.v.slice(0,46)+"…":hrs.v):'<span class="s-m" style="font-style:italic">not stated</span>')+'</dd>';
    h+='</dl>';
    h+='<div class="taglist">'+p.pros.slice(0,2).map(function(x){return '<span class="tag pos">+ '+esc(x.length>60?x.slice(0,60)+"…":x)+'</span>';}).join("")+
       p.cons.slice(0,2).map(function(x){return '<span class="tag warn">− '+esc(x.length>60?x.slice(0,60)+"…":x)+'</span>';}).join("")+'</div>';
    h+='<div class="taglist">'+p.files.map(function(f){return '<span class="filebadge">'+esc(f)+'</span>';}).join("")+'</div>';
    h+='</div>';
    h+='<div class="cardfoot">'+statusButtons(p)+starRow(p)+'</div>';
    if(allRatings(p.id).length>1) h+='<div style="padding:0 16px 12px">'+ratingsLine(p)+'</div>';
    h+='</article>';
  });
  return h+'</div>';
}

/* ---------- SIDE BY SIDE ---------- */
function viewCompare(){
  var h='<div class="sechead"><h2>Side by side</h2><p>Turn photographers on and off to compare any two, three or all six. The row labels stay put as you scroll sideways; search narrows to the categories you care about.</p></div>';
  h+=legendBar();
  h+='<div class="selbar"><span class="eyebrow">Compare</span>'+PHOTOGRAPHERS.map(function(p){
    var on=state.selected.indexOf(p.id)>-1;
    return '<button class="pill" data-sel="'+p.id+'" aria-pressed="'+on+'"><span class="sw"></span>'+esc(p.name)+'</button>';
  }).join("")+'<button class="btn" data-selall="1">All</button><button class="btn" data-selnone="1">None</button>'+
  '<input type="search" class="searchbox" id="rowSearch" placeholder="Filter rows — e.g. drone, album, GST" value="'+esc(window.__rowq||"")+'"></div>';

  var cols=PHOTOGRAPHERS.filter(function(p){ return state.selected.indexOf(p.id)>-1; });
  if(!cols.length) return h+'<div class="empty">Select at least one photographer above.</div>';
  var q=(window.__rowq||"").toLowerCase();

  h+='<div class="tablewrap"><table><thead><tr><th class="rowlab">Category</th>';
  cols.forEach(function(p){
    var pi=priceInfo(p), pkg=pkgOf(p);
    h+='<th class="cell colhead"><div class="n">'+esc(p.name)+'</div><div class="r">via '+esc(p.referral)+' · '+esc(pkg.label)+'</div><div class="pr">'+esc(pi.label)+(p.alacarte?' <span class="chip c-c">calculated</span>':'')+'</div></th>';
  });
  h+='</tr></thead><tbody>';
  h+='<tr class="grouprow"><td class="rowlab">Identity</td>'+cols.map(function(){return '<td></td>';}).join("")+'</tr>';
  h+='<tr><td class="rowlab">Instagram</td>'+cols.map(function(p){
    return '<td class="cell"><a href="https://www.instagram.com/'+esc(p.ig)+'" target="_blank" rel="noopener">@'+esc(p.ig)+'</a></td>';}).join("")+'</tr>';
  h+='<tr><td class="rowlab">Source file</td>'+cols.map(function(p){
    return '<td class="cell">'+p.files.map(function(f){return '<span class="filebadge">'+esc(f)+'</span>';}).join(" ")+'</td>';}).join("")+'</tr>';
  h+='<tr><td class="rowlab">My status</td>'+cols.map(function(p){
    var s=statusOf(p)||"undecided"; var r=state.rating[p.id]||0;
    return '<td class="cell"><b>'+esc(s.charAt(0).toUpperCase()+s.slice(1))+'</b>'+(r?' · '+r+'/5':'')+'</td>';}).join("")+'</tr>';

  SPEC_GROUPS.forEach(function(g){
    var rows=g.rows.filter(function(r){
      if(!q) return true;
      if(r[1].toLowerCase().indexOf(q)>-1) return true;
      return cols.some(function(p){ var f=fld(pkgOf(p).spec[r[0]]); return (f.v+" "+f.q).toLowerCase().indexOf(q)>-1; });
    });
    if(!rows.length) return;
    h+='<tr class="grouprow"><td class="rowlab">'+esc(g.g)+'</td>'+cols.map(function(){return '<td></td>';}).join("")+'</tr>';
    rows.forEach(function(r){
      h+='<tr><td class="rowlab">'+esc(r[1])+'</td>';
      cols.forEach(function(p){ h+='<td class="cell">'+renderField(pkgOf(p).spec[r[0]])+'</td>'; });
      h+='</tr>';
    });
  });
  if(!q || "add-ons".indexOf(q)>-1 || "addons".indexOf(q)>-1){
    h+='<tr class="grouprow"><td class="rowlab">Optional add-ons</td>'+cols.map(function(){return '<td></td>';}).join("")+'</tr>';
    h+='<tr><td class="rowlab">Priced add-ons</td>'+cols.map(function(p){
      if(!p.addons.length) return '<td class="cell"><span class="chip c-m">not mentioned</span> <span class="val s-m">No add-on list in this quotation</span></td>';
      return '<td class="cell">'+p.addons.map(function(a){return '<div style="margin-bottom:4px"><b>'+esc(a.n)+'</b> — '+esc(a.c)+(a.note?'<br><span class="tiny muted">'+esc(a.note)+'</span>':'')+'</div>';}).join("")+'</td>';
    }).join("")+'</tr>';
  }
  return h+'</tbody></table></div>';
}

/* ---------- BY EVENT ---------- */
var currentEvent="wedding";
function viewEvents(){
  var h='<div class="sechead"><h2>Event by event</h2><p>What each photographer puts on the ground for a single event, and what they charge for it. Only The Memory Makers priced their events individually — for everyone else the price line says so plainly rather than guessing a split.</p></div>';
  h+=filterBar();
  h+='<div class="selbar"><span class="eyebrow">Event</span>'+EVENT_ORDER.map(function(e){
    return '<button class="pill" data-ev="'+e.key+'" aria-pressed="'+(currentEvent===e.key)+'">'+esc(e.name)+'</button>';
  }).join("")+'</div>';
  var ev=EVENT_ORDER.filter(function(e){return e.key===currentEvent;})[0];
  h+='<div class="note-b"><b>'+esc(ev.name)+'</b> — '+esc(ev.sub)+'</div>';
  var rows=[];
  visiblePhotographers().forEach(function(p){
    var pkg=pkgOf(p);
    var e=pkg.events.filter(function(x){return x.key===currentEvent;})[0];
    if(e) rows.push({p:p,pkg:pkg,e:e});
  });
  if(!rows.length) return h+'<div class="empty">None of the photographers currently shown quoted for this event.</div>';
  h+='<div class="tablewrap"><table><thead><tr><th class="rowlab">Photographer</th><th style="min-width:230px">Coverage on the day</th><th style="min-width:110px">Photo / video</th><th style="min-width:110px">Hours</th><th style="min-width:250px">Price for this event</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var np=0,nv=0; r.e.crew.forEach(function(c){ if(c.t==="p") np+=c.n; if(c.t==="v") nv+=c.n; });
    h+='<tr><td class="rowlab"><div style="font-family:var(--serif);font-size:15px">'+esc(r.p.name)+'</div><div class="tiny muted">via '+esc(r.p.referral)+'</div><div class="tiny muted">'+esc(r.pkg.label)+'</div></td>';
    h+='<td>'+esc(crewLine(r.e))+
      (r.e.scope?'<div class="tiny '+(r.e.scopeStatus==="u"?"":"muted")+'" style="margin-top:5px">'+(r.e.scopeStatus==="u"?'<span class="chip c-u">verify</span> ':'')+esc(r.e.scope)+'</div>':'')+
      (r.e.deliverables?'<div class="tiny muted" style="margin-top:6px"><b>Deliverables:</b> '+esc(r.e.deliverables.join(" · "))+'</div>':'')+
      (r.e.quote?'<button class="srcbtn" data-src="ev'+(++srcSeq)+'">[source]</button><div class="src" id="ev'+srcSeq+'">'+esc(r.e.quote)+'</div>':'')+'</td>';
    h+='<td class="mono">'+np+' / '+nv+'</td>';
    h+='<td>'+renderField(r.e.hours)+'</td>';
    h+='<td>'+renderField(r.e.price)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<h3 style="font-family:var(--serif);font-size:19px;margin:26px 0 10px">Notes on the '+esc(ev.name)+'</h3>';
  h+=gateHTML("event notes");
  h+='<div class="notesgrid" style="margin-top:12px">'+rows.map(function(r){
    var key=r.p.id+"|"+currentEvent, who=SHby("evnotes",key);
    return '<div class="card pad field"><label>'+esc(r.p.name)+'</label>'+
      '<textarea data-evnote="'+esc(key)+'" placeholder="What matters about this photographer for the '+esc(ev.name)+'…">'+esc(state.evnotes[key]||"")+'</textarea>'+
      (who?'<div class="who">last edited by '+esc(who)+'</div>':'')+
      threadHTML(r.p.id, currentEvent)+'</div>';
  }).join("")+'</div>';
  return h;
}

/* ---------- PRICING ---------- */

  h+='<div class="banner"><b>Careful with these totals.</b> Five of the six quotations never mention tax. If 18% GST turns out to apply on top of them, the ranking below changes. Ask every photographer in writing.</div>';
  h+=filterBar();
  var list=visiblePhotographers();

  h+='<div class="tablewrap"><table><thead><tr><th class="rowlab">Photographer</th><th>Package</th><th style="min-width:120px">Quoted price</th><th style="min-width:150px">Tax</th><th style="min-width:150px">Total payable</th><th style="min-width:200px">Payment terms</th></tr></thead><tbody>';
  list.forEach(function(p){
    var pkg=pkgOf(p), pi=priceInfo(p);
    h+='<tr><td class="rowlab"><div style="font-family:var(--serif);font-size:15px">'+esc(p.name)+'</div><div class="tiny muted">via '+esc(p.referral)+'</div></td>';

    h+='<td class="mono"><b>'+esc(pi.label)+'</b></td>';
    h+='<td>'+renderField(pkg.spec.tax)+'</td>';
    h+='<td>'+renderField(pkg.spec.totalPayable)+'</td>';
    h+='<td>'+renderField(pkg.spec.payment)+'</td></tr>';
  });
  h+='</tbody></table></div>';

  /* Memory Makers builder */
  var mm=byId("mm");
  if(mm && list.indexOf(mm)>-1){
    h+='<h3 style="font-family:var(--serif);font-size:20px;margin:30px 0 6px">The Memory Makers — build your own combination</h3>';
    h+='<p class="small muted" style="margin:0 0 14px;max-width:70ch">They quoted a rate per crew member per event and never gave a total. Tick what you would actually book. The running total is added up here, not quoted by them.</p>';
    h+='<div class="card pad">';
    mm.packages[0].events.forEach(function(e){
      h+='<div style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:4px">'+esc(e.name)+'</div>';
      (e.lines||[]).forEach(function(l){
        h+='<div class="mmrow"><label><input type="checkbox" data-mm="'+esc(l.id)+'"'+(state.mm[l.id]?" checked":"")+'><span>'+esc(l.label)+(l.note?' <span class="tiny muted">('+esc(l.note)+')</span>':'')+'</span></label><span class="mono">'+rup(l.price)+'</span></div>';
      });
      h+='</div>';
    });
    h+='<div class="mmtotal"><div><div class="eyebrow">Your selection</div><div class="tiny muted">Added up by this dashboard — The Memory Makers never quoted a total.</div></div><div style="text-align:right"><span class="chip c-c">calculated</span><div class="v" id="mmTotalOut">'+rup(mmTotal())+'</div></div></div>';
    h+='</div>';
  }

  h+='<h3 style="font-family:var(--serif);font-size:20px;margin:30px 0 12px">Add-ons and other charges</h3>';
  h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">';
  list.forEach(function(p){
    h+='<div class="card pad"><div style="font-family:var(--serif);font-size:17px;margin-bottom:4px">'+esc(p.name)+'</div>';
    if(!p.addons.length){ h+='<p class="small" style="color:var(--miss);font-style:italic;margin:6px 0 0">No add-on pricing appears anywhere in this quotation — worth asking for a written list.</p>'; }
    else{
      h+='<table style="margin-top:6px"><tbody>'+p.addons.map(function(a){
        return '<tr><td style="padding:7px 0;border-bottom:1px dashed var(--line)"><b>'+esc(a.n)+'</b>'+(a.note?'<div class="tiny muted">'+esc(a.note)+'</div>':'')+'</td><td class="mono" style="padding:7px 0;border-bottom:1px dashed var(--line);text-align:right;white-space:nowrap">'+esc(a.c)+'</td></tr>';

/* ============================================================
   SHARED STATE  (Firebase Firestore, offline-first)
   SH mirrors the single Firestore doc boards/main.
   Every entry is {v: value, by: name, at: ms} so the page can
   show who changed what. Ratings are per person, keyed by uid.
   With no Firebase or nobody signed in, SH lives in localStorage
   and the page behaves exactly as it did before.
   ============================================================ */
var SH={status:{},follow:{},fields:{},evnotes:{},asked:{},ratings:{},people:{},tier:{},mm:{}};
var ME=null, COMMENTS=[], FS=null, DOCREF=null, CREF=null, SYNCED=false, DENIED=false;

function SHget(sec,key){ var e=SH[sec]&&SH[sec][key]; return e&&typeof e==="object"&&"v" in e?e.v:e; }
function SHby(sec,key){ var e=SH[sec]&&SH[sec][key]; return e&&typeof e==="object"?(e.by||""):""; }

/* project the shared doc onto the render state the views already read */
function applyShared(){
  state.status={}; state.follow={}; state.notes={}; state.evnotes={}; state.asked={}; state.rating={};
  for(var k in SH.status){ var v=SHget("status",k); if(v) state.status[k]=v; }
  for(var k in SH.follow){ state.follow[k]=SHget("follow",k); }
  for(var k in SH.fields){ var p=k.split("|"); if(!state.notes[p[0]]) state.notes[p[0]]={}; state.notes[p[0]][p[1]]=SHget("fields",k); }
  for(var k in SH.evnotes){ state.evnotes[k]=SHget("evnotes",k); }
  for(var k in SH.asked){ state.asked[k]=SHget("asked",k); }
  for(var k in SH.tier){ state.tier[k]=SHget("tier",k); }
  if(SH.mm && Object.keys(SH.mm).length){ state.mm={}; for(var k in SH.mm) state.mm[k]=SHget("mm",k); }
  var mine=ME?(SH.ratings[ME.uid]||{}):(SH.ratings.local||{});
  for(var k in mine) state.rating[k]=mine[k];
  PHOTOGRAPHERS.forEach(function(p){ if(state.tier[p.id]===undefined) state.tier[p.id]=0; });
}
/* everyone's ratings for one photographer */
function allRatings(pid){
  var out=[];
  for(var uid in SH.ratings){
    var r=SH.ratings[uid][pid];
    if(r) out.push({n:(SH.people[uid]&&SH.people[uid].name)||(uid==="local"?"You":"Someone"), r:r});
  }
  return out;
}
var pending={}, pushTimer=null;
function pushShared(sec,key,value){
  if(!SH[sec]) SH[sec]={};
  SH[sec][key]={v:value, by:ME?ME.name:"", at:Date.now()};
  if(!pending[sec]) pending[sec]={};
  pending[sec][key]=SH[sec][key];
  applyShared(); saveShared();
  scheduleFlush();
}
function pushRating(pid,val){
  var uid=ME?ME.uid:"local";
  if(!SH.ratings[uid]) SH.ratings[uid]={};
  if(val) SH.ratings[uid][pid]=val; else delete SH.ratings[uid][pid];
  if(!pending.ratings) pending.ratings={};
  pending.ratings[uid]=SH.ratings[uid];
  applyShared(); saveShared(); scheduleFlush();
}
function scheduleFlush(){
  if(!DOCREF) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    var payload=pending; pending={};
    if(ME){ payload.people=payload.people||{}; payload.people[ME.uid]={name:ME.name,photo:ME.photo}; }
    DOCREF.set(payload,{merge:true}).catch(function(e){ setSync("error", e&&e.code||"write failed"); });
  },450);
}
function saveShared(){ try{ localStorage.setItem(LSKEY+".shared", JSON.stringify(SH)); }catch(e){} }
function loadShared(){
  try{ var r=localStorage.getItem(LSKEY+".shared"); if(r){ var o=JSON.parse(r); for(var k in o) SH[k]=o[k]; } }catch(e){}
  /* migrate the old local-only notes the first time */
  try{
    if(!Object.keys(SH.fields).length && state.notes){
      for(var pid in state.notes) for(var f in state.notes[pid])
        if(state.notes[pid][f]) SH.fields[pid+"|"+f]={v:state.notes[pid][f],by:"",at:Date.now()};
    }
    if(!Object.keys(SH.status).length) for(var pid in state.status) if(state.status[pid]) SH.status[pid]={v:state.status[pid],by:"",at:Date.now()};
    if(!Object.keys(SH.evnotes).length) for(var k in state.evnotes) if(state.evnotes[k]) SH.evnotes[k]={v:state.evnotes[k],by:"",at:Date.now()};
    if(!Object.keys(SH.asked).length) for(var k in state.asked) if(state.asked[k]) SH.asked[k]={v:true,by:"",at:Date.now()};
    if(!SH.ratings.local && state.rating && Object.keys(state.rating).length) SH.ratings.local=JSON.parse(JSON.stringify(state.rating));
  }catch(e){}
  saveShared();
}

var POPUP_FALLBACK=["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request",
  "auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported","auth/internal-error"];
function doAuth(){
  if(!configured()){
    authNote("bad","Sync is not configured on this copy of the page",
      "This file has no Firebase settings next to it. Open the hosted version at <b>smitmehta19.github.io/photographer-comparison</b> — the local file only saves to this browser.");
    return;
  }
  if(ME){ firebase.auth().signOut().then(function(){ COMMENTS=[]; SYNCED=false; }); return; }
  setSync("","Opening Google…");
  var prov=new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:"select_account"});
  firebase.auth().signInWithPopup(prov).catch(function(e){
    var code=(e&&e.code)||"unknown";
    if(POPUP_FALLBACK.indexOf(code)>-1){
      authNote("ok","Opening Google sign-in in this tab",
        "The pop-up did not open (<code>"+esc(code)+"</code>), so we are redirecting instead. You will come straight back here.");
      setSync("","Redirecting to Google…");
      firebase.auth().signInWithRedirect(prov).catch(function(e2){ showAuthError(e2); });
      return;
    }
    showAuthError(e);
  });
}
function showAuthError(e){
  var code=(e&&e.code)||"unknown", msg=(e&&e.message)||"";
  var hint="";
  if(code==="auth/unauthorized-domain") hint="Add <b>smitmehta19.github.io</b> under Firebase → Authentication → Settings → Authorised domains.";
  else if(code==="auth/operation-not-allowed") hint="Enable the Google provider under Firebase → Authentication → Sign-in method.";
  else if(code.indexOf("api-key")>-1||code==="auth/invalid-api-key") hint="The Firebase settings in firebase-config.js do not match the project.";
  else if(code==="auth/network-request-failed") hint="The browser could not reach Google. Check the connection, then try again.";
  else hint="Send this code to Claude and it can tell you exactly what to change.";
  setSync("error","Sign-in failed");
  authNote("bad","Google sign-in failed — <code>"+esc(code)+"</code>", esc(msg)+"<br><br>"+hint);
}
function initSync(){
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg || !window.firebase || String(cfg.apiKey).indexOf("PASTE_ME")===0){
    setSync("off","Local only — notes stay on this device"); return;
  }
  try{ firebase.initializeApp(cfg); FS=firebase.firestore(); }
  catch(e){ setSync("error","Sync unavailable"); return; }
  DOCREF=FS.doc("boards/main"); CREF=FS.collection("boards/main/comments");
  firebase.auth().getRedirectResult().catch(function(e){ showAuthError(e); });
  setSync("","Not signed in");
  firebase.auth().onAuthStateChanged(function(u){
    if(u && !allowed(u.email)){
      setSync("error","No access for "+u.email);
      authNote("bad","That account is not on the access list",
        esc(u.email)+" signed in successfully, but it is not one of the addresses allowed in the Firestore rules. Sign in with a different account, or add this one to the rules.");
      firebase.auth().signOut(); return;
    }
    ME = u ? {uid:u.uid, name:u.displayName||u.email, email:u.email, photo:u.photoURL||""} : null;
    if(ME){ setSync("on","Synced"); authNote(null); subscribe(); }
    else { setSync("","Not signed in"); }
    applyShared(); render();
  });
}
function subscribe(){
  if(SYNCED||!DOCREF) return; SYNCED=true;
  DOCREF.onSnapshot(function(snap){
    var d=snap.data()||{};
    ["status","follow","fields","evnotes","asked","ratings","people","tier","mm"].forEach(function(k){
      if(d[k]) SH[k]=d[k];
    });
    applyShared(); saveShared(); render();
  }, function(e){
    if(e&&e.code==="permission-denied"){
      setSync("error","Not on the access list");
      DENIED=true; render();
    } else setSync("error","Sync error");
  });
  CREF.orderBy("at").onSnapshot(function(qs){
    COMMENTS=[]; qs.forEach(function(doc){ var o=doc.data(); o.id=doc.id; COMMENTS.push(o); });
    render();
  }, function(){});
}
function addComment(pid, ev, text){
  if(!text.trim()) return;
  var c={pid:pid, ev:ev||"", text:text.trim(), uid:ME?ME.uid:"local",
         name:ME?ME.name:"You", photo:ME?ME.photo:"", at:Date.now()};
  if(CREF&&ME){ CREF.add(c).catch(function(){ alert("Could not post that comment."); }); }
  else { c.id="local"+Date.now(); COMMENTS.push(c); render(); }
}
function delComment(id){
  if(CREF&&ME){ CREF.doc(id).delete().catch(function(){ alert("Could not delete that comment."); }); }
  else { COMMENTS=COMMENTS.filter(function(c){return c.id!==id;}); render(); }
}
function when(ms){
  var d=new Date(ms), n=Date.now(), diff=(n-ms)/1000;
  if(diff<60) return "just now";
  if(diff<3600) return Math.floor(diff/60)+"m ago";
  if(diff<86400) return Math.floor(diff/3600)+"h ago";
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function threadHTML(pid, ev){
  var list=COMMENTS.filter(function(c){ return c.pid===pid && (c.ev||"")===(ev||""); });
  var h='<div class="thread">';
  if(!list.length) h+='<div class="tiny muted">No comments yet.</div>';
  list.forEach(function(c){
    var ini=(c.name||"?").trim().charAt(0).toUpperCase();
    h+='<div class="cmt"><div class="av">'+(c.photo?'<img src="'+esc(c.photo)+'" alt="">':esc(ini))+'</div><div>'+
       '<div class="meta"><span class="nm">'+esc(c.name)+'</span><span class="tm">'+esc(when(c.at))+'</span>'+
       ((ME&&c.uid===ME.uid)||(!ME&&c.uid==="local")?'<button class="del" data-delc="'+esc(c.id)+'">delete</button>':'')+
       '</div><div class="bd">'+esc(c.text)+'</div></div></div>';
  });
  h+='</div>';
  h+='<div class="cmtbox"><textarea data-cmt="'+esc(pid)+'|'+esc(ev||"")+'" placeholder="Add a comment everyone can see…"></textarea>'+
     '<button class="btn" data-cmtsend="'+esc(pid)+'|'+esc(ev||"")+'">Post</button></div>';
  return h;
}
loadState();
loadShared();
applyShared();

if(state.theme) document.documentElement.setAttribute("data-theme",state.theme);
render();
initSync();
</script>
</body>
</html>
